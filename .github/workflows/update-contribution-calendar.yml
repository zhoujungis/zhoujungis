name: Update contribution calendar

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG from contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-contribution-calendar.mjs

      - name: Generate local dashboard assets
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-profile-assets.mjs

      - name: Commit refreshed calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-calendar.svg assets/github-glance.svg assets/trophy-shelf.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution calendar"
          git push
