<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 260" role="img" aria-labelledby="title desc">
  <title id="title">Little trophy shelf</title>
  <desc id="desc">A custom locally generated shelf of developer milestones.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#17122A"/><stop offset="1" stop-color="#3A211C"/></linearGradient></defs>
  <rect width="1140" height="260" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1138" height="258" rx="21" fill="none" stroke="#4B3540"/>
  <text x="36" y="40" fill="#FCD34D" font-family="ui-monospace,monospace" font-size="11" font-weight="700" letter-spacing="3">MILESTONE SHELF / 2026</text>
  <text x="36" y="72" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="800">Tiny wins, arranged with intent</text>
  <text x="36" y="94" fill="#94A3B8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">A hand-drawn alternative to a fragile external trophy widget.</text>
  <g transform="translate(36 110)">
      <rect width="194" height="116" rx="16" fill="#111827" stroke="#26364A"/>
      <circle cx="32" cy="32" r="17" fill="#22D3EE" opacity=".18" stroke="#22D3EE"/>
      <text x="32" y="36" text-anchor="middle" fill="#22D3EE" font-family="ui-monospace,monospace" font-size="10" font-weight="800">01</text>
      <text x="20" y="68" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="800">BUILD</text>
      <text x="20" y="91" fill="#94A3B8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">Ideas into artifacts</text>
    </g><g transform="translate(252 110)">
      <rect width="194" height="116" rx="16" fill="#111827" stroke="#26364A"/>
      <circle cx="32" cy="32" r="17" fill="#F59E0B" opacity=".18" stroke="#F59E0B"/>
      <text x="32" y="36" text-anchor="middle" fill="#F59E0B" font-family="ui-monospace,monospace" font-size="10" font-weight="800">02</text>
      <text x="20" y="68" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="800">SHIP</text>
      <text x="20" y="91" fill="#94A3B8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">Small, useful releases</text>
    </g><g transform="translate(468 110)">
      <rect width="194" height="116" rx="16" fill="#111827" stroke="#26364A"/>
      <circle cx="32" cy="32" r="17" fill="#A78BFA" opacity=".18" stroke="#A78BFA"/>
      <text x="32" y="36" text-anchor="middle" fill="#A78BFA" font-family="ui-monospace,monospace" font-size="10" font-weight="800">03</text>
      <text x="20" y="68" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="800">LEARN</text>
      <text x="20" y="91" fill="#94A3B8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">Keep the loop open</text>
    </g><g transform="translate(684 110)">
      <rect width="194" height="116" rx="16" fill="#111827" stroke="#26364A"/>
      <circle cx="32" cy="32" r="17" fill="#FB7185" opacity=".18" stroke="#FB7185"/>
      <text x="32" y="36" text-anchor="middle" fill="#FB7185" font-family="ui-monospace,monospace" font-size="10" font-weight="800">04</text>
      <text x="20" y="68" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="800">SHARE</text>
      <text x="20" y="91" fill="#94A3B8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">Leave a better trail</text>
    </g><g transform="translate(900 110)">
      <rect width="194" height="116" rx="16" fill="#111827" stroke="#26364A"/>
      <circle cx="32" cy="32" r="17" fill="#34D399" opacity=".18" stroke="#34D399"/>
      <text x="32" y="36" text-anchor="middle" fill="#34D399" font-family="ui-monospace,monospace" font-size="10" font-weight="800">05</text>
      <text x="20" y="68" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="800">REPEAT</text>
      <text x="20" y="91" fill="#94A3B8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">Make it a practice</text>
    </g>
</svg>