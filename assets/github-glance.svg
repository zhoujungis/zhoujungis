<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 300" role="img" aria-labelledby="title desc">
  <title id="title">GitHub at a glance for zhoujungis</title>
  <desc id="desc">A locally generated profile metrics dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#102B3A"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".52" stop-color="#0E7490"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
  </defs>
  <rect width="1140" height="300" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1138" height="298" rx="21" fill="none" stroke="#26364A"/>
  <rect x="36" y="28" width="8" height="56" rx="4" fill="url(#line)"/>
  <text x="62" y="48" fill="#67E8F9" font-family="ui-monospace,monospace" font-size="11" font-weight="700" letter-spacing="3">GITHUB / AT A GLANCE</text>
  <text x="62" y="78" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="800">A small dashboard for a very active curiosity</text>
  <text x="62" y="101" fill="#94A3B8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Generated from the public GitHub API</text>
  <g transform="translate(36 116)">
      <rect width="246" height="150" rx="18" fill="#111827" stroke="#26364A"/>
      <rect x="20" y="20" width="34" height="4" rx="2" fill="#22D3EE"/>
      <text x="20" y="51" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="10" font-weight="700" letter-spacing="2">PUBLIC REPOS</text>
      <text x="20" y="96" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="800">13</text>
      <text x="20" y="124" fill="#64748B" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">open playgrounds</text>
    </g><g transform="translate(306 116)">
      <rect width="246" height="150" rx="18" fill="#111827" stroke="#26364A"/>
      <rect x="20" y="20" width="34" height="4" rx="2" fill="#F59E0B"/>
      <text x="20" y="51" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="10" font-weight="700" letter-spacing="2">FOLLOWERS</text>
      <text x="20" y="96" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="800">5</text>
      <text x="20" y="124" fill="#64748B" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">people in the loop</text>
    </g><g transform="translate(576 116)">
      <rect width="246" height="150" rx="18" fill="#111827" stroke="#26364A"/>
      <rect x="20" y="20" width="34" height="4" rx="2" fill="#FB7185"/>
      <text x="20" y="51" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="10" font-weight="700" letter-spacing="2">TOTAL STARS</text>
      <text x="20" y="96" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="800">9</text>
      <text x="20" y="124" fill="#64748B" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">signals of interest</text>
