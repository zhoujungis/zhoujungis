      <rect x="20" y="20" width="34" height="4" rx="2" fill="#A78BFA"/>
      <text x="20" y="51" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="10" font-weight="700" letter-spacing="2">TOP LANGUAGE</text>
      <text x="20" y="96" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="800">JavaScript</text>
      <text x="20" y="124" fill="#64748B" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">most-used recently</text>
