<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" role="img" aria-labelledby="title desc">
  <title id="title">Repository shelf pinned project card</title>
  <desc id="desc">A custom card linking to all zhoujungis repositories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#3F2A12"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#F59E0B"/><stop offset="1" stop-color="#FB7185"/></linearGradient>
  </defs>
  <rect width="860" height="260" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="858" height="258" rx="19" fill="none" stroke="#4B3A28"/>
  <path d="M690 39h126v126H690z" fill="#F59E0B" opacity=".08" transform="rotate(12 753 102)"/>
  <rect x="34" y="34" width="46" height="46" rx="14" fill="url(#accent)"/>
  <path d="M48 50h18v18H48zM53 45v28M43 55h28" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
  <text x="34" y="125" fill="#FCD34D" font-family="ui-monospace,monospace" font-size="13" font-weight="700" letter-spacing="3">02 / REPOSITORY SHELF</text>
  <text x="34" y="160" fill="#F8FAFC" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="800">Find the next useful thing</text>
  <text x="34" y="190" fill="#CBD5E1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Browse the full collection of tools, notes, and experiments.</text>
  <rect x="34" y="216" width="188" height="26" rx="13" fill="#111827" stroke="#B45309"/>
  <text x="52" y="234" fill="#FCD34D" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700">BROWSE REPOSITORIES ↗</text>
</svg>
