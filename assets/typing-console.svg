  <rect x="70" y="157" width="8" height="16" fill="#B7E36B"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite" /></rect>
  <text x="930" y="170" text-anchor="end" fill="#66777C" font-family="ui-monospace,monospace" font-size="10">typing / live notes</text>
