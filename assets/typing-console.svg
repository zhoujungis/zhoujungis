  <text x="42" y="109" fill="#7CC7E8" font-family="ui-monospace,monospace" font-size="13">&gt;</text>
  <text x="70" y="109" fill="#F5F0E6" font-family="ui-monospace,monospace" font-size="13" clip-path="url(#line2)">learn -&gt; build -&gt; share -&gt; repeat</text>
  <text x="42" y="142" fill="#FF8066" font-family="ui-monospace,monospace" font-size="13">&gt;</text>
