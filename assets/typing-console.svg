<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Typing console for zhoujungis</title>
  <desc id="desc">Animated terminal-style notes that type out a creative workflow.</desc>
  <defs>
    <clipPath id="line1"><rect x="70" y="61" width="0" height="22"><animate attributeName="width" values="0;18;36;54;72;90;108;126;144;162;180;198;216;234;252;270;288;306;324;342;360;360;0" dur="7.2s" repeatCount="indefinite" /></rect></clipPath>
    <clipPath id="line2"><rect x="70" y="94" width="0" height="22"><animate attributeName="width" values="0;18;36;54;72;90;108;126;144;162;180;198;216;234;252;270;288;306;324;342;360;360;0" dur="7.2s" begin=".35s" repeatCount="indefinite" /></rect></clipPath>
    <clipPath id="line3"><rect x="70" y="127" width="0" height="22"><animate attributeName="width" values="0;18;36;54;72;90;108;126;144;162;180;198;216;234;252;270;288;306;324;342;360;360;0" dur="7.2s" begin=".7s" repeatCount="indefinite" /></rect></clipPath>
  </defs>
  <rect width="1000" height="190" rx="18" fill="#11191D"/>
  <rect x="1" y="1" width="998" height="188" rx="17" fill="none" stroke="#3D4D52"/>
  <rect x="24" y="22" width="952" height="28" rx="7" fill="#1C292D"/>
  <circle cx="44" cy="36" r="4" fill="#FF8066"/><circle cx="60" cy="36" r="4" fill="#F6CA75"/><circle cx="76" cy="36" r="4" fill="#B7E36B"/>
